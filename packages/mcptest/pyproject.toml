[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcptest"
version = "0.1.0"
description = "Automated tests, linting and breaking-change checks for MCP servers, as a pytest plugin and CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sri Krishna Lingamaneni" }]
keywords = ["mcp", "model context protocol", "pytest", "testing", "lint", "ai agents", "llm", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/srikrishnaL/kitforge/tree/main/packages/mcptest"
Source = "https://github.com/srikrishnaL/kitforge"
Issues = "https://github.com/srikrishnaL/kitforge/issues"
Changelog = "https://github.com/srikrishnaL/kitforge/blob/main/packages/mcptest/CHANGELOG.md"

[project.scripts]
mcptest = "mcptest.cli:main"

[project.entry-points.pytest11]
mcptest = "mcptest.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/mcptest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
