[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "askfirst"
version = "0.1.0"
description = "Confirm destructive MCP tool calls with the user (elicitation, with a signed-token fallback for clients without it) and add a read-only mode to Python MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sri Krishna Lingamaneni" }]
keywords = [
  "mcp", "model context protocol", "mcp server", "elicitation", "confirmation",
  "human in the loop", "destructive tools", "read-only mode", "tool filtering", "fastmcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pydantic>=2", "anyio>=4", "mcp>=1.10; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/srikrishnaL/kitforge/tree/main/packages/askfirst"
Source = "https://github.com/srikrishnaL/kitforge"
Issues = "https://github.com/srikrishnaL/kitforge/issues"
Changelog = "https://github.com/srikrishnaL/kitforge/blob/main/packages/askfirst/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/askfirst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
