name: Release

# Runs on every push to main: any package whose version has no tag yet
# (<published name>-v<version>, e.g. pytest-mcp-server-v0.2.0) is tested, published to PyPI or
# npm, tagged and given a GitHub release. So releasing is: bump the version, merge.
# Pushing such a tag by hand still works, and so does "Run workflow" (it releases what's missing).
on:
  push:
    branches: [main]
    tags: ["*-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Find packages to release
        id: plan
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            releases=$(python .github/scripts/release_plan.py "$GITHUB_REF_NAME")
          else
            releases=$(python .github/scripts/release_plan.py)
          fi
          echo "$releases"
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - uses: actions/checkout@v4
      - name: Package to release
        id: tag
        env:
          TAG: ${{ matrix.tag }}
          PKG: ${{ matrix.pkg }}
          VER: ${{ matrix.ver }}
          DIR: ${{ matrix.dir }}
          KIND: ${{ matrix.kind }}
        run: |
          echo "Releasing $PKG $VER from $DIR as $TAG"
          { echo "tag=$TAG"; echo "pkg=$PKG"; echo "ver=$VER"; echo "dir=$DIR"; echo "kind=$KIND"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.tag.outputs.kind == 'python'
        with:
          python-version: "3.13"
      - name: Test, check version, build (Python)
        if: steps.tag.outputs.kind == 'python'
        run: |
          set -e
          dir="${{ steps.tag.outputs.dir }}"
          want="${{ steps.tag.outputs.ver }}"
          have=$(python -c "import tomllib;print(tomllib.load(open('$dir/pyproject.toml','rb'))['project']['version'])")
          [ "$have" = "$want" ] || { echo "tag says $want but pyproject.toml says $have"; exit 1; }
          pip install -q build twine -e "$dir[test]"
          pytest -q "$dir"
          python -m build "$dir" --outdir dist
          twine check dist/*
      - name: Publish to PyPI
        if: steps.tag.outputs.kind == 'python'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true  # a re-run after a failed tag step must not fail here

      - uses: actions/setup-node@v4
        if: steps.tag.outputs.kind == 'node'
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Test, check version, publish (Node)
        if: steps.tag.outputs.kind == 'node'
        working-directory: ${{ steps.tag.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          have=$(node -p "require('./package.json').version")
          [ "$have" = "${{ steps.tag.outputs.ver }}" ] || { echo "version mismatch: $have"; exit 1; }
          npm install --no-audit --no-fund
          npm test
          name=$(node -p "require('./package.json').name")
          if [ "$(npm view "$name@$have" version 2>/dev/null)" = "$have" ]; then
            echo "$name@$have is already on npm"
          else
            npm publish --access public
          fi

      - name: Tag and GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.pkg }} ${{ steps.tag.outputs.ver }}
          body: "See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/${{ steps.tag.outputs.dir }}/CHANGELOG.md)."
          files: dist/*
