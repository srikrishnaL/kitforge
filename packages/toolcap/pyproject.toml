[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "toolcap"
version = "0.1.0"
description = "Keep MCP tool results under the client's token limit (Claude Code's 25,000): cursor pagination of long lists and text, or safe truncation, in one call or decorator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Sri Krishna Lingamaneni" }]
keywords = [
  "mcp", "model context protocol", "mcp server", "tool result", "response size", "token limit",
  "max_mcp_output_tokens", "pagination", "cursor", "truncate", "context window", "fastmcp",
  "llm", "agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pydantic>=2", "anyio>=4", "mcp>=1.10; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/srikrishnaL/kitforge/tree/main/packages/toolcap"
Source = "https://github.com/srikrishnaL/kitforge"
Issues = "https://github.com/srikrishnaL/kitforge/issues"
Changelog = "https://github.com/srikrishnaL/kitforge/blob/main/packages/toolcap/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/toolcap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
