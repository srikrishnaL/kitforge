name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test every Python package
        run: |
          set -e
          python -m pip install --upgrade pip
          for dir in packages/*/; do
            [ -f "$dir/pyproject.toml" ] || continue
            echo "::group::$dir"
            python -m venv "/tmp/venv-$(basename "$dir")"
            . "/tmp/venv-$(basename "$dir")/bin/activate"
            pip install -q -e "$dir[test]"
            pytest -q "$dir"
            deactivate
            echo "::endgroup::"
          done

  python-sdk-interop:
    # Run mcptest against servers built with the official MCP Python SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "packages/mcptest[test]" mcp
      - run: pytest -q packages/mcptest/tests/test_sdk_interop.py

  mcptest-action:
    # Run the reusable GitHub Action in packages/mcptest against the test server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean server passes lint and snapshot diff
        uses: ./packages/mcptest
        with:
          command: python3 packages/mcptest/tests/servers/fake_server.py
          fail-on: warning
          snapshot: packages/mcptest/tests/servers/fake-tools.json
      - name: Breaking changes are reported without failing when allowed
        uses: ./packages/mcptest
        with:
          command: FAKE_TOOLS=v2 python3 packages/mcptest/tests/servers/fake_server.py
          snapshot: packages/mcptest/tests/servers/fake-tools.json
          allow-breaking: "true"
      - name: Breaking changes fail the step
        id: breaking
        continue-on-error: true
        uses: ./packages/mcptest
        with:
          command: FAKE_TOOLS=v2 python3 packages/mcptest/tests/servers/fake_server.py
          snapshot: packages/mcptest/tests/servers/fake-tools.json
      - name: Lint errors fail the step
        id: bad
        continue-on-error: true
        uses: ./packages/mcptest
        with:
          command: FAKE_TOOLS=bad python3 packages/mcptest/tests/servers/fake_server.py
      - name: Check the failing cases failed
        env:
          BREAKING: ${{ steps.breaking.outcome }}
          BAD: ${{ steps.bad.outcome }}
        run: |
          echo "breaking=$BREAKING bad=$BAD"
          [ "$BREAKING" = failure ] && [ "$BAD" = failure ]

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test every Node package
        run: |
          set -e
          found=0
          for dir in packages/*/; do
            [ -f "$dir/package.json" ] || continue
            found=1
            echo "::group::$dir"
            (cd "$dir" && npm install --no-audit --no-fund && npm test)
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no Node packages yet"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check every Python package
        run: |
          pip install -q build twine
          for dir in packages/*/; do
            [ -f "$dir/pyproject.toml" ] || continue
            python -m build "$dir" --outdir "dist/$(basename "$dir")"
            twine check "dist/$(basename "$dir")"/*
          done
      - name: Release plan reads every package
        run: python .github/scripts/release_plan.py
